<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Design your dream bracelet with our interactive customizer. Choose from beautiful beads, charms, and clasps to create a one-of-a-kind piece.">
    <title>La Perlette — Design Your Dream Bracelet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600;700&family=Dancing+Script:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Floating particles background -->
    <div class="particles" id="particles"></div>

    <!-- Header -->
    <header class="header" id="header">
        <div class="header-inner">
            <div class="logo">
                <span class="logo-icon">✿</span>
                <div class="logo-text">
                    <h1>La Perlette</h1>
                    <span class="logo-tagline">handcrafted with love</span>
                </div>
            </div>
            <nav class="header-nav" style="display:flex;align-items:center;gap:1.5rem;">
                <a href="homepage.html" style="font-size:0.85rem;font-weight:500;color:var(--text-secondary);text-decoration:none;transition:color 0.3s;">Home</a>
                <a href="customizer.html" style="font-size:0.85rem;font-weight:600;color:var(--pink-600);text-decoration:none;transition:color 0.3s;">Customizer</a>
                <a href="checkout.html" style="font-size:0.85rem;font-weight:500;color:var(--text-secondary);text-decoration:none;transition:color 0.3s;">Checkout</a>
            </nav>
            <div class="header-actions">
                <button class="btn-undo" id="btnUndo" title="Undo last action" disabled>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10h13a4 4 0 0 1 0 8H9"/><polyline points="7 14 3 10 7 6"/></svg>
                </button>
                <button class="btn-clear" id="btnClear" title="Start over">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M5 6v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6"/></svg>
                    <span>Start Over</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <!-- Left Panel: Bracelet Preview -->
        <section class="preview-section" id="previewSection">
            <div class="preview-header">
                <h2 class="section-title">Your Bracelet</h2>
                <div class="slot-counter">
                    <span id="slotCount">0</span> / <span id="maxSlots">12</span> beads
                </div>
            </div>

            <!-- Bracelet Canvas -->
            <div class="bracelet-stage" id="braceletStage">
                <div class="bracelet-glow"></div>
                <div class="bracelet-ring" id="braceletRing">
                    <!-- Clasp -->
                    <div class="clasp-area" id="claspArea">
                        <div class="clasp" id="clasp" title="Click to change clasp">
                            <span class="clasp-icon">⟐</span>
                        </div>
                    </div>
                    <!-- Bead slots will be generated by JS -->
                </div>
                <div class="bracelet-label">
                    <span class="drag-hint" id="dragHint">✨ Click beads below to add them</span>
                </div>
            </div>

            <!-- Size Selector -->
            <div class="size-selector">
                <label class="size-label">Bracelet Size</label>
                <div class="size-options" id="sizeOptions">
                    <button class="size-btn" data-size="small" data-slots="8">S <span>6"</span></button>
                    <button class="size-btn active" data-size="medium" data-slots="12">M <span>7"</span></button>
                    <button class="size-btn" data-size="large" data-slots="14">L <span>8"</span></button>
                </div>
            </div>

            <!-- Price Summary -->
            <div class="price-card" id="priceCard">
                <div class="price-breakdown">
                    <div class="price-row">
                        <span>Beads</span>
                        <span id="beadPrice">₹0</span>
                    </div>
                    <div class="price-row">
                        <span>Charms</span>
                        <span id="charmPrice">₹0</span>
                    </div>
                    <div class="price-row">
                        <span>Clasp</span>
                        <span id="claspPrice">₹49</span>
                    </div>
                    <div class="price-divider"></div>
                    <div class="price-row price-total">
                        <span>Total</span>
                        <span id="totalPrice">₹49</span>
                    </div>
                </div>
                <button class="btn-cart" id="btnAddToCart">
                    <span class="btn-cart-icon">📭</span>
                    <span>Add to Bag</span>
                    <span class="btn-sparkle">✨</span>
                </button>
                <a href="checkout.html" class="btn-cart" id="btnGoToCheckout" style="display:none;margin-top:0.5rem;background:linear-gradient(135deg,#d4a853,#b8962e);text-decoration:none;text-align:center;">
                    <span>🛍️</span>
                    <span>Proceed to Checkout</span>
                </a>
            </div>
        </section>

        <!-- Right Panel: Component Selector -->
        <section class="selector-section" id="selectorSection">
            <!-- Tabs -->
            <div class="tabs" id="tabs">
                <button class="tab active" data-tab="beads">
                    <span class="tab-icon">●</span>
                    <span class="tab-label">Beads</span>
                    <span class="tab-count" id="beadCount">8</span>
                </button>
                <button class="tab" data-tab="charms">
                    <span class="tab-icon">♡</span>
                    <span class="tab-label">Charms</span>
                    <span class="tab-count" id="charmCount">6</span>
                </button>
                <button class="tab" data-tab="clasps">
                    <span class="tab-icon">⟐</span>
                    <span class="tab-label">Clasps</span>
                    <span class="tab-count" id="claspCount">2</span>
                </button>
            </div>

            <!-- Search / Filter -->
            <div class="filter-bar">
                <div class="search-box">
                    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                    <input type="text" id="searchInput" placeholder="Search components..." class="search-input">
                </div>
                <div class="color-filters" id="colorFilters">
                    <button class="color-dot active" data-color="all" title="All colors">
                        <span style="background: conic-gradient(#f8a4c8, #a78bfa, #60a5fa, #34d399, #fbbf24, #f8a4c8)"></span>
                    </button>
                    <button class="color-dot" data-color="pink" title="Pink"><span style="background:#f8a4c8"></span></button>
                    <button class="color-dot" data-color="purple" title="Purple"><span style="background:#a78bfa"></span></button>
                    <button class="color-dot" data-color="blue" title="Blue"><span style="background:#60a5fa"></span></button>
                    <button class="color-dot" data-color="white" title="White"><span style="background:#f0e6f6"></span></button>
                    <button class="color-dot" data-color="gold" title="Gold"><span style="background:#d4a853"></span></button>
                    <button class="color-dot" data-color="green" title="Green"><span style="background:#6bcb9b"></span></button>
                </div>
            </div>

            <!-- Component Grid -->
            <div class="component-grid-wrapper">
                <!-- Beads Panel -->
                <div class="component-panel active" id="panel-beads">
                    <div class="component-grid" id="beadGrid">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <!-- Charms Panel -->
                <div class="component-panel" id="panel-charms">
                    <div class="component-grid" id="charmGrid">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <!-- Clasps Panel -->
                <div class="component-panel" id="panel-clasps">
                    <div class="component-grid clasps-grid" id="claspGrid">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Toast Notification -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Confetti Canvas -->
    <canvas class="confetti-canvas" id="confettiCanvas"></canvas>

    <script src="script.js"></script>
</body>
</html>
